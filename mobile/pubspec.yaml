name: mobile
description: "Vestory, a collectible card game to learn investing."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  http_cache_drift_store: ^7.0.1
  material_ui: ^1.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
